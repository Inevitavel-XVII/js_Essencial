<html>
    <meta charset="UTF-8"/>
    <script>
        console.log("1", typeof 1)
        console.log("1.2", typeof 1.2)
        console.log("Felipe", typeof Felipe)
        console.log("1", typeof "1")
        console.log("true", typeof true)

        console.log("string + number", "2" + 2)
        console.log("string + number", typeof "2" + 2)
        /*
      Esse código foi escrito durante a vídeo aula de tipos de dados
      existentes no Java script. Você consegue ver os tipos de dados quando
      abir o navegador.
      A parte do código que está escrito:
      
      console.log("string + number", "2" + 2)
      console.log("string + number", typeof "2" + 2)
      
      Foi usado para explicar o fato de que o Java Script concatena diferentes 
      tipos de dados para formar uma string ou um novo dado. Nesse exemplo o 
      dado number 2 foi transformado em texto.
      # Tipagem

     O JavaScript é uma linguagem fracamente tipada, isso significa que "ele"
     tentará converter em tempo de execução o dados baseado no valor.

     Exemplos:

    ```javascript
    1
    1.2
    "Felipe"
    true
    ```

    Atualmente existem manteiras de "forçar" o tipo, e até formas de utilizar
     linguagens / supersets focados nisso como o TypeScript.

    Isso é um ponto de atenção importante dentro do JS, já que a depender do 
    valor da variável o seu programa pode "dar bugs" em função de tipos 
    inesperados. E para isso utilizaremos artifícios como o comparador idêntico.
      */
    </script>
</html>
