<html>
    <meta charset="UTF-8"/>
    <script>
      console.log(1)
      console.log(1.2) // 1,2
      console.log(0.12) // .12

      console.log(10000) // 10.000,00
      /*
       O código Math.PI e Math.E são números pré-programados
       Números inteiros e número flutuantes são tratados como Number
       Você não precisa usar ponto em números grandes, por exemplo na linha 8,
       se quiser deixar mais claro para o usuário que 10000 é dez mil, então não faça
       essa formatação no momento de declarar número ou fazer contas
      */

      console.log(Math.PI)
      console.log(Math.E)
    </script>
</html>
