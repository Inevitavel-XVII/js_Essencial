<html>
    <meta charset="UTF-8"/>
    <script>
        console.log(NaN) // Not A Number
        console.log("A" / 2)
        console.log(typeof NaN)
        /*
        NaN é um tipo especial do JavaScript para identificar um número que não pode ser identificado
        como um número válido. Por exemplo dividir a letra A por 2, ele mostra o NaN. NaN é 
        identificado como number pelo JavaScript se você usar o Typeof. Fique atento a esse tipo
        de situação, o sistema pode dar alguns bugs caso ele não consiga identificar a natureza
        de determinado número
         */
    </script>
</html>
