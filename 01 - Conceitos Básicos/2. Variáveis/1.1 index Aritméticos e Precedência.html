    /* Comparação 
    Servem para comparar dois valores e/ou variáveis.

    - Igual - `==`
    - Diferente - `!=`
    - Menor - `<`
    - Menor igual - `<=`
    - Maior - `>`
    - Maior igual - `>=`

    Uma comparação sempre retornará verdadeiro ou falso:

    ```javascript
    1 > 2 -> false
    1 == 1 -> true
    "A" == "A" -> true
    "A" < "B" -< true
    ```

    Para variáveis:

    ```javascript
    const idade = 16
    const limite = 18 

    idade >= limite
    ```
    -----------------------------------------------------------------
    *Comparação estrita (idêntico)
    O JavaScript tenta converter dados, por isso o uso do `==` pode ocasionar problemas.

    Ex:

    ```javascript
    "1" == 1
    1 == true
    null == undefined
    ```

    Para solucionar este problema utilizamos a comparação estrita (idêntico).

    ```javascript
    "1" === 1
    1 === true
    null === undefined
    null !== undefined
    ```
    Para lidar com o problema do JavaScript ser uma linguagem fracamente tipada, é indicado que
    você use a comparação estrita. Isso vai evitar instabilidade. Muita das vezes você quer fazer uma
    comparação de um número com o outro, mas o console acaba entendo que é uma string
    ----------------------------------------------------------------------
    * Conceito de Falsy and True
    O valor é considerado falso quando:

    ```
    false
    0
    -0
    0n
    ""
    ''
    ``
    null
    undefined
    NaA
    ```

    O valor é considerado verdadeiro quando:

    ```
    true
    {}
    []
    1
    1.2
    "0"
    "false"
    -1
    -1.2
    Infinity
    -Infinity
    ```
    No JS ser falso não significa ser boleano, mas como algo a ser considerado negativo.

// Pré Incremento e Pós Incremento
let a = 5;
let b = 10;

let resultado1 = ++a + b; // a é 6, b é 10, resultado1 é 16
let resultado2 = a++ + b; // a é 7, b é 10, resultado2 é 16 (o valor de a usado é 6)
let resultado3 = b-- - a; // b é 9, a é 7, resultado3 é 3 (o valor de b usado é 10)
let resultado4 = --b - a; // b é 8, a é 7, resultado4 é 1 (o valor de b usado é 9)

console.log("Resultado 3:", resultado3); // Saída: 3
