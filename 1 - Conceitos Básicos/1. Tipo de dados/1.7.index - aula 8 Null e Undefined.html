<html>
    <meta charset="UTF-8"/>
    <script>
        console.log(null) // objeto com ausência de valor
        console.log(undefined) // variável declarada, mas ainda não tem um valor atribuido (indefinido)
        console.log(typeof null) // object -- indica que é objeto, mas sem valor
        console.log(typeof undefined) // false -- por ser algo indefinido
        console.log(undefined = null) // true -- são considerados iguais por conversão de tipos
        console.log(undefined === null) //não são definidos
        /*
        
         */
    </script>
</html>
